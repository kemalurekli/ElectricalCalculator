# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon. KSP + Hilt annotation processing is
# metaspace hungry, so both heap and metaspace are raised above the defaults.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Run independent tasks in parallel and reuse task outputs across builds.
org.gradle.parallel=true
org.gradle.caching=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true

# AGP 9 provides built-in Kotlin support (the `org.jetbrains.kotlin.android`
# plugin must NOT be applied). KSP 2.3+ integrates with it directly, which is
# what Hilt and Room rely on for code generation.

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Generate per-module R classes instead of one transitive R containing every
# dependency's resources. Keeps the R class small and builds incremental.
android.nonTransitiveRClass=true
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
